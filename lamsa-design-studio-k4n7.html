 var d=rings.map(function(r){return'M'+r.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('L')+'Z'}).join('');
 var nsh={n:S.name,cm:[S.W/10,S.H/10],vb:[0,0,S.W,S.H],d:d};
 var k=Math.min(4,2400/Math.max(S.W,S.H)),cv=document.createElement('canvas');cv.width=Math.round(S.W*k);cv.height=Math.round(S.H*k);var c=cv.getContext('2d');
 var ys=zones(),T=K.tpls(),B=K.bg(),jobs=[];
 c.fillStyle='#fffdfa';c.fillRect(0,0,cv.width,cv.height);
 ys.slice(0,-1).forEach(function(y0,i){var t=T.filter(function(x){return x.id===S.th[i]})[0];if(!t)return;jobs.push(loadImg(B[t.bimg]).then(function(im){var y1=ys[i+1];c.save();c.beginPath();c.rect(0,y0*k,cv.width,(y1-y0)*k);c.clip();c.fillStyle=t.bg||'#fffdfa';c.fillRect(0,y0*k,cv.width,(y1-y0)*k);
   if(im){var Wd=cv.width,Hd=(y1-y0)*k,sc=Math.max(Wd/im.width,Hd/im.height),w=im.width*sc,h=im.height*sc;c.drawImage(im,(Wd-w)/2,y0*k+(Hd-h)/2,w,h);}c.restore();}));});
 return Promise.all(jobs).then(function(){
  c.strokeStyle='#b8923f';c.lineWidth=.6*k;S.lines.forEach(function(y){c.beginPath();c.moveTo(2*k,y*k);c.lineTo((S.W-2)*k,y*k);c.stroke();});
  S.pcs.forEach(function(p){if(p.mode!=='deco')return;c.lineWidth=.7*k;ringsOf(p).forEach(function(r){c.beginPath();r.forEach(function(q,i){i?c.lineTo(q[0]*k,q[1]*k):c.moveTo(q[0]*k,q[1]*k)});c.closePath();c.stroke();});});
  var img=cv.toDataURL('image/png');
  var big=0,bi=0;ys.slice(0,-1).forEach(function(y,i){var hh=ys[i+1]-y;if(!S.th[i]&&hh>big){big=hh;bi=i;}});if(!big)bi=0;
  var t0=ys[bi],t1=ys[bi+1],tp=Math.round(100*t0/S.H),bt=Math.round(100*(S.H-t1)/S.H);
  var tpl={id:'fd_'+key,n:{ar:S.name,fr:S.name},shape:key,size:0,arts:[],frame:'none',bg:'#fffdfa',ac:'#b8923f',ink:'#3a2c1a',ev:'wedding',bimg:'fd_'+key,ar:+(S.H/S.W).toFixed(4),txt:{x:50,t:tp+6,b:bt+6,w:72,s:.6},d:{fa:'Amiri',orn:'none',dst:'lines',ev:'حفل زفاف',evfr:'Mariage'}};
  var from=S.from,st=JSON.parse(JSON.stringify(S));st.from=null;
  var rec={key:key,nsh:nsh,tpl:tpl,img:img,state:st,saved:false};FD[key]=rec;
  K.reg(key,S.name,nsh,false);K.addTpl(tpl,img);K.use(tpl.id);K.bld();
  if(from&&FD[from]&&FD[from].saved){doSave(key);delFD(from);}
  syncBtns();return rec;});}
function store(){var a=Object.keys(FD).map(function(k){return FD[k]}).filter(function(r){return r.saved});try{localStorage.setItem('kfd',JSON.stringify(a.slice(-12)));}catch(e){try{localStorage.setItem('kfd',JSON.stringify(a.slice(-4).map(function(r){r=JSON.parse(JSON.stringify(r));return r})));}catch(e2){}}}
function doSave(key){var r=FD[key];if(!r)return;r.saved=true;K.reg(key,r.nsh.n,r.nsh,true);store();}
function delFD(key){delete FD[key];K.unreg(key);store();}
try{JSON.parse(localStorage.getItem('kfd')||'[]').forEach(function(r){r.saved=true;FD[r.key]=r;K.reg(r.key,r.nsh.n,r.nsh,true);K.addTpl(r.tpl,r.img);});}catch(e){}
/* ---------- open / buttons ---------- */
function open(edit){ST=fresh();SEL=null;LSEL=null;uid=1;if(edit&&edit.state){ST=JSON.parse(JSON.stringify(edit.state));ST.from=edit.key;uid=ST.pcs.reduce(function(m,p){return Math.max(m,p.id)},0)+1;}render();window.scrollTo(0,0);document.documentElement.style.overflow='hidden';$('kfd').classList.add('on');}
function shut(){$('kfd').classList.remove('on');document.documentElement.style.overflow='';}
$('kfx').onclick=shut;
$('kfok').onclick=function(){var b=this;b.textContent='جارٍ الإنشاء…';build().then(function(){b.textContent='إنشاء الشكل وفتحه في التطبيق';shut();},function(e){b.textContent='إنشاء الشكل وفتحه في التطبيق';shut();console.error('FDERR '+(e&&e.stack||e));});};
var row=$('kacts'),eb,sb;
if(row){var fb=document.createElement('button');fb.className='btn';fb.id='kfdb';fb.textContent='تصميم شكل حرّ';fb.onclick=function(){open();};row.insertBefore(fb,row.firstChild);
 eb=document.createElement('button');eb.className='btn';eb.textContent='تعديل التصميم';eb.style.display='none';eb.onclick=function(){var r=FD[K.get().shape];if(r)open(r);};row.insertBefore(eb,fb.nextSibling);
 sb=document.createElement('button');sb.className='btn';sb.textContent='إضافة إلى أشكالي';sb.style.display='none';sb.onclick=function(){var k=K.get().shape;doSave(k);K.bld();syncBtns();};row.insertBefore(sb,eb.nextSibling);}
function syncBtns(){if(!eb)return;var r=FD[K.get().shape];eb.style.display=r?'':'none';sb.style.display=(r&&!r.saved)?'':'none';}
setInterval(syncBtns,600);
window.__KFD={open:open};
})();</script>
