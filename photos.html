<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>قوالب الصور</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&family=Aref+Ruqaa:wght@700&family=Great+Vibes&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2b2a26;--muted:#7a746a;--line:#e3dccd;--acc:#a9852f;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Cairo','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:6;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.top b{font-size:16px}
.x{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.pv{position:sticky;top:57px;z-index:5;background:#fff;padding:8px 12px;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
.pvbox{width:100%;max-width:560px;border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:140px}
#cv{display:block;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.ctl{max-width:720px;margin:0 auto;padding:14px;display:grid;gap:18px}
.g{display:grid;gap:8px}
.g>h3{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;min-height:42px;color:var(--ink)}
.opt[aria-pressed=true]{border-color:var(--acc);background:#fbf4e2;font-weight:600}
.opt.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700}
.opt.dng{color:#a33}
.tp{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tb{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:6px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:12px;color:var(--ink)}
.tb[aria-pressed=true]{border-color:var(--acc);background:#fbf4e2;font-weight:700}
.tb canvas{display:block}
.note{font-size:13px;color:var(--muted);margin:0}
.rg{width:100%;max-width:340px}
.sw{width:36px;height:36px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--acc)}
input[type=color]{width:46px;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:2px;background:#fff}
.add{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;justify-content:center}
.add button{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 28px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-width:200px}
.add button:disabled{opacity:.6}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;accent-color:#a9852f}
.top,.pv,.add{position:static!important;flex:none}
.ctl{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;align-content:start;max-width:none!important;margin:0!important;width:100%;padding-inline:max(14px,calc((100% - 692px)/2))!important}
input[type=text],input[type=date],input[type=number],textarea{-webkit-user-select:text;user-select:text}
button,select,input,.x{color:var(--ink);-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,#a9852f 50%),linear-gradient(135deg,#a9852f 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 12px) 55%;background-size:6px 6px;background-repeat:no-repeat;padding-inline-end:30px}
input[type=range]{-webkit-appearance:auto;appearance:auto;accent-color:#a9852f}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto;accent-color:#a9852f}
input[type=color]{-webkit-appearance:auto;appearance:auto}
button:focus,input:focus,select:focus{outline:none}
input[type=text]:focus,input[type=date]:focus,select:focus{border-color:var(--acc)}
::selection{background:transparent}
.pvbox{border:0!important}
</style></head><body>
<div class="top"><b>قوالب وإطارات الصور</b><button class="x" id="close" type="button">إغلاق</button></div>
<div class="pv"><div class="pvbox" id="pvbox"><canvas id="cv"></canvas></div></div>
<div class="ctl" id="ctl"></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="add"><button id="add" type="button">إضافة إلى البطاقة</button></div>
