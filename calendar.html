<style>
:root{color-scheme:light;--ink:#2b2a26;--muted:#7a746a;--line:#e3dccd;--acc:#a9852f;--bg:#fff}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 'Cairo','Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.top b{font-size:16px}
.x{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
.pv{position:sticky;top:61px;z-index:4;background:#fff;padding:10px 14px;display:flex;justify-content:center;border-bottom:1px solid var(--line)}
.pvbox{width:100%;max-width:520px;min-height:120px;max-height:36vh;border:1px dashed var(--line);border-radius:12px;padding:16px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.pvbox canvas{max-width:100%;max-height:calc(36vh - 34px);width:auto;height:auto;display:block}
.ctl{max-width:720px;margin:0 auto;padding:14px;display:grid;gap:16px}
.g{display:grid;gap:8px}
.g>h3{margin:0;font-size:14px;color:var(--muted);font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer;min-height:40px}
.opt[aria-pressed=true]{border-color:var(--acc);background:#fbf4e2;font-weight:600}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1;min-width:140px}
input[type=text],input[type=date],select{font:inherit;font-size:16px;padding:9px 10px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);width:100%}
.sw{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--acc)}
.chk{display:flex;align-items:center;gap:8px;font-size:14px}
.chk input{width:18px;height:18px}
.add{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;justify-content:center}
.add button{border:0;background:var(--acc);color:#fff;border-radius:12px;padding:12px 28px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-width:200px}
.note{font-size:13px;color:var(--muted)}
.fbtn{font:inherit;font-size:26px;line-height:1.5;padding:8px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;width:100%;text-align:start;display:flex;justify-content:space-between;align-items:center}
.fbtn small{font-size:12px;color:var(--muted);font-family:'Cairo',sans-serif}
.fpan{border:1.5px solid var(--line);border-radius:12px;padding:10px;max-height:52vh;overflow:auto;display:grid;gap:8px;background:#fff}
.fh{font-size:13px;font-weight:700;color:var(--muted);padding:4px 2px;position:sticky;top:-10px;background:#fff}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
.fb{font:inherit;font-size:22px;line-height:1.5;padding:8px 6px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:clip}
.fb[aria-pressed=true]{border-color:var(--acc);background:#fbf4e2}
</style></head><body>
<div class="top"><b>التقويمات</b><button class="x" id="close" type="button">إغلاق</button></div>
<div class="pv"><div class="pvbox" id="pvbox"><canvas id="cv"></canvas></div></div>
<div class="ctl" id="ctl"></div>
<div class="add"><button id="add" type="button">إضافة إلى البطاقة</button></div>

 lang:'ar',first:1,ind:false,shape:'heart',heart:'thick',stem:true,col:0,hcol:-1,custom:'',cmet:false,clev:60,hmet:false,hlev:60,hcustom:'',fMon:'Amiri',fDay:'Cairo',fNum:'Amiri',

function sel(id,list,cur,lab){return '<label class="f">'+lab+'<select id="'+id+'">'+list.map(function(f){return '<option value="'+f+'"'+(f===cur?' selected':'')+' style="font-family:\''+f+'\'">'+f+'</option>'}).join('')+'</select></label>';}

 if(kind==='hcol')h='<button type="button" class="opt" aria-pressed="'+(cur===-1)+'" data-hcol="-1">نفس لون النص</button>'+h;
 return '<div class="row">'+h+'</div>';}

 h+='<div class="g"><h3>الشكل حول اليوم</h3><div class="row">'+SHAPES.map(function(x){return btn(x[1],S.shape===x[0],'data-shape="'+x[0]+'"')}).join('')+'</div></div>';
 h+='<div class="g"><h3>نمط خط الشكل</h3><div class="row">'+HEARTS.map(function(x){return btn(x[1],S.heart===x[0],'data-heart="'+x[0]+'"')}).join('')+'</div>'+

 h+='<div class="g"><h3>لون الشكل</h3>'+sw('hcol',S.hcol)+'<label class="f" style="max-width:220px">أي لون آخر<input type="color" id="hcustom" value="'+(S.hcustom||'#a9852f')+'" style="width:100%;height:42px;border:1.5px solid var(--line);border-radius:10px;padding:2px"></label>'+metUI(S.hmet,S.hlev,'hmet','hlev')+'</div>';
 var mi=(+S.date.split('-')[1]||1)-1,mAr=LANG.ar.m[mi],mLat=(S.lang==='fr'?LANG.fr:LANG.en).m[mi],ttl=S.title.trim();
 h+=fontPick('fMon','خط اسم الشهر',mAr,mLat)+fontPick('fDay','خط أسماء الأيام','الاثنين','Mon')+fontPick('fNum','خط الأرقام','١٨ 18','18');
 h+='<div class="g"><h3>عنوان اختياري فوق التقويم</h3><div class="row"><label class="f">النص<input type="text" id="title" dir="auto" value="'+S.title.replace(/"/g,'&quot;')+'" placeholder="Save the Date"></label>'+'</div>'+fontPick('fTit','خط العنوان',ttl||'احفظوا الموعد',ttl||'Save the Date')+
    '<div class="row"><label class="chk"><input type="checkbox" id="year"'+(S.year?' checked':'')+'>إظهار السنة بجانب الشهر</label><label class="chk"><input type="checkbox" id="upper"'+(S.upper?' checked':'')+'>حروف كبيرة للشهر</label></div></div>';

/* ---------- drawing ---------- */
var HP=null;
function heartPath(){return shapePath();}
function paintOf(ctx,c,x0,x1){if(!c.g)return c.s;var g=ctx.createLinearGradient(x0,0,x1,0);c.g.forEach(function(s,i){g.addColorStop(i/(c.g.length-1),s)});return g;}
function spaced(ctx,str,x,y,sp,align){ /* manual letter spacing (Latin only) */
 var w=0,i,ws=[];for(i=0;i<str.length;i++){ws[i]=ctx.measureText(str[i]).width;w+=ws[i]+(i<str.length-1?sp:0);}
 var cx=align==='center'?x-w/2:x;ctx.textAlign='left';for(i=0;i<str.length;i++){ctx.fillText(str[i],cx,y);cx+=ws[i]+sp;}ctx.textAlign='center';}
function drawHeart(ctx,cx,cy,size,style,paint,glow,numColor){
 var sc=size/40;ctx.save();ctx.translate(cx-20*sc,cy-18*sc);ctx.scale(sc,sc);
 var lw=1/sc;
 function stroke(w,dash){ctx.lineWidth=w*lw;ctx.lineCap='round';ctx.lineJoin='round';ctx.setLineDash(dash||[]);ctx.strokeStyle=paint;ctx.stroke(heartPath());}
 if(style==='dots')stroke(6.4,[0.01,9.5*lw]);
 else if(style==='line')stroke(3);
 else if(style==='thick')stroke(5);
 else if(style==='solid'){ctx.fillStyle=paint;ctx.fill(heartPath());}
 else if(style==='dbl'){stroke(3.2);ctx.translate(20*(1-.82),18*(1-.82));ctx.scale(.82,.82);stroke(3.2/ .82);}
 else if(style==='neon'){ctx.shadowColor=glow;ctx.shadowBlur=26;stroke(5);ctx.shadowBlur=14;stroke(5);}
 ctx.restore();
}
function render(canvas,scale){
 var L=LANG[S.lang],p=S.date.split('-').map(Number),y=p[0],m=p[1]-1,d=p[2];
 var W=1200*(scale||1),u=W/1200;
 var cc=colOf(S.col,S.cmet,S.clev,S.custom),hc=S.hcol===-1?cc:colOf(S.hcol,S.hmet,S.hlev,S.hcustom);
 var padX=70*u,inW=W-2*padX,colW=inW/7;
 var rtl=L.rtl;
 var sel=new Date(y,m,d),first=new Date(y,m,1);
 var order=[];for(var i=0;i<7;i++)order.push((S.first+i)%7);
 var colOfDow=function(dow){var idx=order.indexOf(dow);return rtl?(6-idx):idx;}; /* RTL: first day on the right */
 var cx0=function(idx){return padX+colW*(idx+.5);};
 /* vertical plan */
 var yy=40*u,items=[];
 var titleSz=0;
 if(S.title.trim()){titleSz=120*u;items.push('t');}
 var H;
 var ctx0=canvas.getContext('2d');
 /* measure layout first */
 var layout={title:0,mon:0,hdr:0,rows:0,after:0};
 var cur=36*u;
 if(titleSz){layout.title=cur+titleSz*.8;cur+=titleSz*1.15;}
 layout.mon=cur+70*u;cur+=120*u;
 layout.hdr=cur+36*u;cur+=82*u;
 var rowH=(S.mode==='week'?0:92*u);
 if(S.mode==='week'){layout.rows=cur+74*u;cur+=140*u;var hs=(S.heart==='solid'?150:176)*u;
   if(S.stem&&S.heart!=='dbl'||S.stem)cur+=150*u;else cur+=40*u;}
 else{var pad=(new Date(y,m,1).getDay()-S.first+7)%7,dim=new Date(y,m+1,0).getDate(),rows=Math.ceil((pad+dim)/7);layout.rows=cur+rowH*.5;cur+=rowH*rows+30*u;}
 H=Math.ceil(cur);
 canvas.width=Math.round(W);canvas.height=H;
 var ctx=canvas.getContext('2d');ctx.clearRect(0,0,W,H);ctx.textBaseline='alphabetic';ctx.textAlign='center';
 if(rtl)ctx.direction='rtl';else ctx.direction='ltr';
 var paintText=paintOf(ctx,cc,padX,W-padX),paintHeart=paintOf(ctx,hc,padX,W-padX);
 /* title */
 if(titleSz){ctx.font=titleSz+'px "'+S.fTit+'"';ctx.fillStyle=paintText;ctx.fillText(S.title.trim(),W/2,layout.title);}
 /* month */
 var mt=L.m[m];if(S.upper&&!rtl)mt=mt.toUpperCase();
 var mtxt=mt+(S.year?(rtl?' / ':' ')+digits(y):'');
 var msz=(rtl?66:62)*u;ctx.font=msz+'px "'+S.fMon+'"';ctx.fillStyle=paintText;
 if(!rtl&&S.upper)spaced(ctx,mtxt,W/2,layout.mon,msz*.28,'center');else ctx.fillText(mtxt,W/2,layout.mon);
 /* day names */
 var dsz=(rtl?38:36)*u;ctx.font=dsz+'px "'+S.fDay+'"';ctx.globalAlpha=.88;ctx.fillStyle=paintText;
 order.forEach(function(dow,i){var idx=rtl?(6-i):i;ctx.fillText(L.d[dow],cx0(idx),layout.hdr);});
 ctx.globalAlpha=1;
 var nsz=(S.mode==='week'?62:50)*u;ctx.font=nsz+'px "'+S.fNum+'"';
 var hsize=(S.mode==='week'?170:118)*u,numOn=S.heart==='solid'?'#ffffff':null;
 var glow=(hc.g?hc.g[1]:hc.s);
 function num(n,cx,cy,isSel){
  if(isSel&&S.shape!=='none'){drawHeart(ctx,cx,cy-nsz*.33,hsize,S.heart,paintHeart,glow);}
  ctx.font=nsz+'px "'+S.fNum+'"';ctx.fillStyle=(isSel&&numOn)?numOn:paintText;ctx.fillText(digits(n),cx,cy);}
 if(S.mode==='week'){
  var start=new Date(sel);start.setDate(sel.getDate()-((sel.getDay()-S.first+7)%7));
  for(var i2=0;i2<7;i2++){var dd=new Date(start);dd.setDate(start.getDate()+i2);var idx=rtl?(6-i2):i2;
    num(dd.getDate(),cx0(idx),layout.rows,dd.getTime()===sel.getTime());}
  if(S.stem&&S.shape!=='none'){var sx=cx0(rtl?(6-((sel.getDay()-S.first+7)%7)):((sel.getDay()-S.first+7)%7));
    var y0=layout.rows-nsz*.33+hsize*.5*(S.heart==='dbl'?1:1)-hsize*.06,y1=y0+120*u;
    ctx.save();ctx.strokeStyle=paintHeart;ctx.lineWidth=(S.heart==='thick'?5:3.4)*u;ctx.lineCap='round';
    if(S.heart==='dots'||true)ctx.setLineDash([0.1,9*u]);if(S.heart==='line'||S.heart==='thick'||S.heart==='solid'){ctx.setLineDash([]);}
    if(S.heart==='neon'){ctx.shadowColor=glow;ctx.shadowBlur=14;}
    ctx.beginPath();ctx.moveTo(sx,y0);ctx.lineTo(sx,y1);ctx.stroke();ctx.restore();}
 }else{
  var pad2=(first.getDay()-S.first+7)%7,dim2=new Date(y,m+1,0).getDate();
  for(var day=1;day<=dim2;day++){var pos=pad2+day-1,r=Math.floor(pos/7),c=pos%7,idx2=rtl?(6-c):c;
    num(day,cx0(idx2),layout.rows+r*rowH+nsz*.3,day===d);}
 }
 if(S.bgm){var t0=document.createElement('canvas');t0.width=canvas.width;t0.height=canvas.height;t0.getContext('2d').drawImage(canvas,0,0);var o0=bgWrap(t0,S,S.bgpd*12*u,S.bgrr*7*u);canvas.width=o0.width;canvas.height=o0.height;canvas.getContext('2d').drawImage(o0,0,0);}
 return {w:canvas.width,h:canvas.height};
}

 var fv=e.target.closest('[data-fv]');if(fv){var q=fv.dataset.fv.split('|');S[q[0]]=q.slice(1).join('|');OPENF=null;ui();refresh();return;}

   S.fDay=S.lang==='ar'?'Cairo':(S.fDay==='Cairo'?'Playfair Display':S.fDay);S.fNum=S.lang==='ar'?'Amiri':(S.fNum==='Amiri'?'Playfair Display':S.fNum);
   S.first=S.lang==='ar'?6:(S.first===6?0:S.first);if(S.lang==='ar'&&!S._arSet){}}
 if(b.dataset.first!==undefined)S.first=+b.dataset.first;
 if(b.dataset.heart)S.heart=b.dataset.heart;
 if(b.dataset.shape)S.shape=b.dataset.shape;
 if(b.dataset.col!==undefined)S.col=+b.dataset.col;
 if(b.dataset.hcol!==undefined)S.hcol=+b.dataset.hcol;
 ui();refresh();});
document.addEventListener('change',function(e){var br=bgHandle(e,S);if(br==='ui'){ui();refresh();}});
document.addEventListener('input',function(e){var t=e.target;var br=bgHandle(e,S);if(br){if(br==='ui')ui();refresh();return;}
 if(t.id==='date'&&t.value){S.date=t.value;refresh();}
 else if(t.id==='custom'){S.custom=t.value;S.col='custom';[].forEach.call(document.querySelectorAll('[data-col]'),function(x){x.setAttribute('aria-pressed','false')});refresh();}
 else if(t.id==='hcustom'){S.hcustom=t.value;S.hcol='custom';[].forEach.call(document.querySelectorAll('[data-hcol]'),function(x){x.setAttribute('aria-pressed','false')});refresh();}
 else if(t.id==='clev'||t.id==='hlev'){S[t.id]=+t.value;refresh();}
 else if(t.id==='title'){S.title=t.value;refresh();}
 else if(t.type==='checkbox'){S[t.id]=t.checked;refresh();if(t.id==='stem'||t.id==='year'||t.id==='upper'||t.id==='ind'){}}
 else if(t.tagName==='SELECT'){S[t.id]=t.value;refresh();}});
$('#close').onclick=function(){parent.postMessage({kind:'kerima-cal-close'},'*');};
$('#add').onclick=function(){var b=$('#add');b.disabled=true;
 fontsReady().then(function(){var c=document.createElement('canvas');var r=render(c,1.5);
  parent.postMessage({kind:'kerima-cal',png:c.toDataURL('image/png'),w:r.w,h:r.h,state:JSON.parse(JSON.stringify(S))},'*');b.disabled=false;});};
window.addEventListener('message',function(e){var m=e.data||{};
 if(m.kind==='kerima-cal-init'){if(m.bg){PVBG=m.bg;}EDIT=!!m.edit;if(m.state){for(var k in m.state)S[k]=m.state[k];}
  $('#add').textContent=EDIT?'تحديث التقويم':'إضافة إلى البطاقة';ui();refresh();}});
ui();refresh();
try{if(parent&&parent!==window)parent.postMessage({kind:'kerima-cal-ready'},'*');}catch(_){}
})();
